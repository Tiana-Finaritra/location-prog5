<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <title>Réservation de Pack Sonorisation</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <main>
    <h1>Réserver une Sonorisation</h1>
    <form id="reservationForm">
      <label for="startDate">Date de début :</label><br>
      <input type="date" id="startDate" required><br>

      <label for="duration">Durée (en jours) :</label><br>
      <input type="number" id="duration" min="1" required><br>

      <button type="submit">Réserver</button>
    </form>

    <div id="message"></div>
    <h2>Réservations existantes :</h2>
    <ul id="reservationsList"></ul>

    <script src="script.js"></script>
  </main>
</body>

</html>
